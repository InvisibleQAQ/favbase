<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">How favbase turns saved content into answers</title>
  <desc id="desc">A conceptual three-step flow: collect from six supported sources, organize locally with chunks tags and vectors, then search or chat with links back to original sources.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2F7CF6"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="20" fill="#F7FAFC"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="48" y="45" fill="#637381" font-size="14" font-weight="700">CONCEPTUAL PRODUCT FLOW</text>

    <g transform="translate(48 76)">
      <text x="0" y="0" fill="#2F7CF6" font-size="15" font-weight="800">01</text>
      <text x="0" y="37" fill="#141A21" font-size="27" font-weight="750">Collect</text>
      <text x="0" y="68" fill="#637381" font-size="17">Bring saved items together.</text>
      <g transform="translate(0 96)">
        <rect width="260" height="102" rx="12" fill="#FFFFFF" stroke="#DFE3E8"/>
        <g font-size="13" font-weight="700">
          <circle cx="27" cy="28" r="9" fill="#FB7299"/><text x="43" y="33" fill="#454F5B">Bilibili</text>
          <circle cx="125" cy="28" r="9" fill="#24292F"/><text x="141" y="33" fill="#454F5B">GitHub</text>
          <circle cx="27" cy="74" r="9" fill="#2F7CF6"/><text x="43" y="79" fill="#454F5B">Bookmarks</text>
          <circle cx="125" cy="74" r="9" fill="#141A21"/><text x="141" y="79" fill="#454F5B">X · Zhihu · YouTube</text>
        </g>
      </g>
    </g>

    <path d="M345 190H410" fill="none" stroke="#2F7CF6" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(438 76)">
      <text x="0" y="0" fill="#2F7CF6" font-size="15" font-weight="800">02</text>
      <text x="0" y="37" fill="#141A21" font-size="27" font-weight="750">Organize locally</text>
      <text x="0" y="68" fill="#637381" font-size="17">Build a searchable knowledge base.</text>
      <g transform="translate(0 96)">
        <rect width="288" height="102" rx="12" fill="#FFFFFF" stroke="#DFE3E8"/>
        <ellipse cx="45" cy="29" rx="25" ry="10" fill="#E8F1FF" stroke="#2F7CF6"/>
        <path d="M20 29V64C20 70 31 75 45 75S70 70 70 64V29" fill="#E8F1FF" stroke="#2F7CF6"/>
        <path d="M20 46C20 52 31 57 45 57S70 52 70 46" fill="none" stroke="#2F7CF6"/>
        <text x="96" y="27" fill="#141A21" font-size="15" font-weight="700">Browser-local PGlite</text>
        <g font-size="13" font-weight="700">
          <rect x="96" y="42" width="60" height="26" rx="6" fill="#E8F1FF"/><text x="109" y="60" fill="#1E63C8">chunks</text>
          <rect x="164" y="42" width="48" height="26" rx="6" fill="#FFF2B8"/><text x="176" y="60" fill="#704800">tags</text>
          <rect x="220" y="42" width="58" height="26" rx="6" fill="#FFE7DF"/><text x="230" y="60" fill="#A63A1B">vectors</text>
        </g>
      </g>
    </g>

    <path d="M763 190H828" fill="none" stroke="#2F7CF6" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(856 76)">
      <text x="0" y="0" fill="#2F7CF6" font-size="15" font-weight="800">03</text>
      <text x="0" y="37" fill="#141A21" font-size="27" font-weight="750">Find and ask</text>
      <text x="0" y="68" fill="#637381" font-size="17">Get answers you can verify.</text>
      <g transform="translate(0 96)">
        <rect width="296" height="102" rx="12" fill="#FFFFFF" stroke="#DFE3E8"/>
        <circle cx="35" cy="31" r="13" fill="none" stroke="#2F7CF6" stroke-width="3"/>
        <path d="M44 41L54 51" stroke="#2F7CF6" stroke-width="3" stroke-linecap="round"/>
        <path d="M78 27H262M78 47H220" stroke="#C4CDD5" stroke-width="7" stroke-linecap="round"/>
        <path d="M22 77H32L38 70L45 79L53 72H62" fill="none" stroke="#F6C33B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="78" y="82" fill="#454F5B" font-size="14" font-weight="700">Cited answer → original source</text>
      </g>
    </g>

    <text x="600" y="329" text-anchor="middle" fill="#637381" font-size="14">Your library stays inspectable: every retrieved result belongs to a saved item and keeps its original URL.</text>
  </g>
</svg>
